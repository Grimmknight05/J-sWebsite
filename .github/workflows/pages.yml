name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Ensure the workflow has explicit permissions to push to repo and Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build site (Vite)
        run: |
          # Compile TS then build with Vite — use vite.config.ts base setting for relative assets
          npx tsc
          npx vite build

      - name: Create additional HTML pages
        run: |
          for p in coding film photography modeling music; do
            cp dist/index.html dist/${p}.html
            # inject data-page attribute into body tag
            sed -i "s/<body>/<body data-page=\"${p}\">/" dist/${p}.html
          done

      - name: Configure git for deploy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Prefer a personal token `GH_PAGES_PAT` (create this secret if your org blocks GITHUB_TOKEN pushes)
          github_token: ${{ secrets.GH_PAGES_PAT || secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
